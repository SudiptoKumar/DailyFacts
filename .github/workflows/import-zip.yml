name: Import Project ZIP

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Choose an operation"
        required: true
        default: "import"
        type: choice
        options:
          - clean
          - import

permissions:
  contents: write

jobs:
  project-manager:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Clean repository
        if: ${{ inputs.operation == 'clean' }}
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "state" \
            ! -iname "*.zip" \
            -exec rm -rf {} +
          if [ -d ".github" ]; then
            find .github -mindepth 1 -maxdepth 1 \
              ! -name "workflows" \
              -exec rm -rf {} +
          fi
          echo "Repository cleaned; publication ledger remains on the separate daily-facts-state branch."

      - name: Find ZIP
        if: ${{ inputs.operation == 'import' }}
        id: find_zip
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ZIPS < <(find . -maxdepth 1 -type f -iname "*.zip" -print)
          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "::error::No ZIP file found in repository root."
            exit 1
          fi
          if [ "${#ZIPS[@]}" -gt 1 ]; then
            echo "::error::More than one ZIP file found."
            printf '%s\n' "${ZIPS[@]}"
            exit 1
          fi
          echo "ZIP=${ZIPS[0]}" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        if: ${{ inputs.operation == 'import' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/project
          mkdir -p /tmp/project
          unzip -q -o "${{ steps.find_zip.outputs.ZIP }}" -d /tmp/project

      - name: Detect project root
        if: ${{ inputs.operation == 'import' }}
        id: project_root
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/tmp/project"
          if [ -f "$ROOT/main.py" ] || [ -f "$ROOT/requirements.txt" ] || [ -d "$ROOT/.github" ]; then
            echo "ROOT=$ROOT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mapfile -t DIRS < <(find "$ROOT" -mindepth 1 -maxdepth 1 -type d)
          mapfile -t FILES < <(find "$ROOT" -mindepth 1 -maxdepth 1 -type f)
          if [ "${#DIRS[@]}" -eq 1 ] && [ "${#FILES[@]}" -eq 0 ]; then
            echo "ROOT=${DIRS[0]}" >> "$GITHUB_OUTPUT"
          else
            echo "ROOT=$ROOT" >> "$GITHUB_OUTPUT"
          fi

      - name: Import project without publication ledger
        if: ${{ inputs.operation == 'import' }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.project_root.outputs.ROOT }}"
          rsync -a \
            --exclude=".git/" \
            --exclude="state/publication_state.json" \
            --exclude="state/" \
            "$ROOT/" ./
          rm -f ./*.zip
          echo "Project imported. Publication state is intentionally not part of ZIP deployment."

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          if [ "${{ inputs.operation }}" = "clean" ]; then
            MESSAGE="Clean repository"
          else
            MESSAGE="Import Daily Facts project"
          fi
          git commit -m "$MESSAGE"
          git push
