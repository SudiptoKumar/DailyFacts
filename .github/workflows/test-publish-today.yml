name: Test Publish Today

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Exact date YYYY-MM-DD; blank = current Asia/Dhaka date"
        required: false
        default: ""
      batch:
        description: "Batch to replay"
        required: true
        default: "both"
        type: choice
        options: ["1", "2", "both"]
      max_posts:
        description: "Maximum posts per batch"
        required: false
        default: "10"
      no_image:
        description: "Skip image resolution"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL || '@FactsNewsroom' }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      CEREBRAS_MODEL: ${{ secrets.CEREBRAS_MODEL || 'gpt-oss-120b' }}
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      USE_CEREBRAS: "true"
      TIMEZONE: Asia/Dhaka
      BATCH_SIZE: "10"
      STRICT_DATASET: "false"
      IMAGE_REQUIRED: "false"
      IMAGE_MIN_SCORE: "16"
      CACHE_IMAGES: "false"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: python -m py_compile *.py tests/*.py
      - run: python main.py --self-test
      - name: Replay selected date without touching production state
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ -n "${{ inputs.date }}" ]]; then
            args+=(--date "${{ inputs.date }}")
          fi
          args+=(--max-posts "${{ inputs.max_posts }}")
          if [[ "${{ inputs.no_image }}" == "true" ]]; then
            args+=(--no-image)
          fi
          if [[ "${{ inputs.batch }}" == "1" ]]; then
            python main.py "${args[@]}" --batch 1 --republish-test
          elif [[ "${{ inputs.batch }}" == "2" ]]; then
            python main.py "${args[@]}" --batch 2 --republish-test
          else
            python main.py "${args[@]}" --batch 1 --republish-test
            python main.py "${args[@]}" --batch 2 --republish-test
          fi
